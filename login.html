<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — IVFComputer</title>
  <meta name="description" content="IVFComputer brings a fertility clinic's WhatsApp, lab reports, EMR, cycles, billing and patient app into one calm place — and shows each doctor what needs them today.">
  <link rel="canonical" href="https://ivfcomputer.com/login">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d9488'/%3E%3Ctext x='50%25' y='54%25' font-family='Arial,sans-serif' font-size='30' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='middle'%3EIC%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/assets/logo-mark.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ivfcomputer.com/">
  <meta property="og:site_name" content="IVFComputer">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="IVFComputer — Software for fertility clinics">
  <meta property="og:description" content="WhatsApp, lab reports, EMR, cycles, billing and a patient app — in one calm place for your clinic.">
  <meta property="og:image" content="https://ivfcomputer.com/assets/app-dashboard.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* The same soft, warm look as the app: mint page, deep-teal ink,
       rounded white cards and pastel tiles. */
    :root {
      --page: #f0fdfa;
      --page-2: #e6faf5;
      --ink: #134e4a;
      --ink-soft: #0f766e;
      --muted: #5b6b69;
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --line: #d9f2ec;
      --white: #ffffff;
      --mint: #ccfbf1;  --mint-ink: #115e59;
      --rose: #fee2e2;  --rose-ink: #991b1b;
      --amber: #fef3c7; --amber-ink: #92400e;
      --sky: #e0f2fe;   --sky-ink: #075985;
      --lilac: #ede9fe; --lilac-ink: #5b21b6;
      --head: 'Outfit', system-ui, sans-serif;
      --body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --shadow: 0 2px 10px rgba(15,118,110,.06);
      --shadow-lg: 0 30px 60px -24px rgba(19,78,74,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--body); color: var(--ink); background: var(--page); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
    h1, h2, h3 { font-family: var(--head); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: .8125rem; font-weight: 600; color: var(--ink-soft); background: var(--white); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; }
    .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,.15); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: .9375rem; border-radius: 999px; padding: 14px 24px; transition: transform .15s ease, box-shadow .15s ease, background .15s; white-space: nowrap; }
    .btn-primary { background: var(--teal); color: white; box-shadow: 0 10px 24px -10px rgba(13,148,136,.7); }
    .btn-primary:hover { background: var(--teal-dark); transform: translateY(-1px); }
    .btn-ghost { background: var(--white); color: var(--ink); border: 1px solid var(--line); }
    .btn-ghost:hover { border-color: #99e6d6; transform: translateY(-1px); }
    section { padding: 96px 0; }
    .section-head { max-width: 680px; margin-bottom: 48px; }
    .section-head h2 { font-size: clamp(2rem, 4vw, 2.75rem); margin: 14px 0 12px; }
    .section-head p { font-size: 1.0625rem; color: var(--muted); }
    .center { text-align: center; margin-left: auto; margin-right: auto; }

    /* Header */
    header { position: sticky; top: 0; z-index: 50; background: rgba(240,253,250,.85); backdrop-filter: saturate(160%) blur(12px); -webkit-backdrop-filter: saturate(160%) blur(12px); border-bottom: 1px solid transparent; transition: border-color .2s; }
    header.scrolled { border-bottom-color: var(--line); }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; font-family: var(--head); font-weight: 600; font-size: 1.25rem; }
    .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--teal); color: white; display: grid; place-items: center; font-size: .9375rem; font-weight: 700; }
    .nav-links { display: flex; gap: 32px; font-size: .9375rem; font-weight: 500; color: var(--muted); }
    .nav-links a:hover { color: var(--ink); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-right .signin { font-size: .9375rem; font-weight: 600; color: var(--ink-soft); padding: 8px 4px; }
    .nav-right .btn { padding: 10px 20px; }

    /* Hero */
    .hero { padding: 64px 0 88px; overflow: hidden; }
    .hero-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 56px; align-items: center; }
    .hero h1 { font-size: clamp(2.5rem, 5.4vw, 4rem); margin: 20px 0; }
    .hero h1 em { font-style: normal; color: var(--teal); }
    .hero .lede { font-size: 1.1875rem; color: var(--muted); max-width: 520px; margin-bottom: 32px; }
    .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; }
    .hero-proof { margin-top: 32px; display: flex; align-items: center; gap: 12px; font-size: .875rem; color: var(--muted); }
    .hero-proof img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid white; box-shadow: var(--shadow); }
    .hero-proof img + img { margin-left: -14px; }
    .hero-proof b { color: var(--ink); font-weight: 600; }

    /* The picture: the real app, with made-up patients */
    .shot { position: relative; padding: 20px 0 48px 0; }
    .shot::before { content: ''; position: absolute; inset: -40px -80px -20px 10%; background: radial-gradient(closest-side, rgba(94,234,212,.45), transparent); z-index: 0; }
    .browser { position: relative; z-index: 1; background: white; border-radius: 18px; box-shadow: var(--shadow-lg); border: 1px solid var(--line); overflow: hidden; }
    .browser-bar { display: flex; align-items: center; gap: 6px; padding: 12px 16px; background: #f7fdfb; border-bottom: 1px solid var(--line); }
    .browser-bar i { width: 10px; height: 10px; border-radius: 50%; background: #d1e7e2; }
    .browser-bar span { margin-left: 12px; font-size: .75rem; color: var(--muted); background: white; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
    .phone { position: absolute; z-index: 2; right: -12px; bottom: 0; width: 34%; max-width: 210px; border-radius: 30px; background: #0b1f1d; padding: 7px; box-shadow: var(--shadow-lg); }
    .phone img { border-radius: 24px; aspect-ratio: 390 / 700; object-fit: cover; object-position: top; width: 100%; }
    .float { position: absolute; z-index: 3; background: white; border-radius: 16px; box-shadow: 0 18px 40px -16px rgba(19,78,74,.4); padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: .8125rem; }
    .float b { display: block; font-weight: 700; color: var(--ink); }
    .float small { color: var(--muted); font-size: .75rem; }
    .float .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
    .float-a { left: -28px; top: 44%; }
    .float-b { left: 12%; bottom: 4px; }
    @media (prefers-reduced-motion: no-preference) {
      .float-a { animation: drift 6s ease-in-out infinite; }
      .float-b { animation: drift 5s ease-in-out -2s infinite; }
      .phone { animation: drift 7s ease-in-out -1s infinite; }
      .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
      .reveal.in { opacity: 1; transform: none; }
    }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* Proof strip */
    .strip { padding: 28px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--white); }
    .strip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .strip-item { display: flex; align-items: center; gap: 12px; font-size: .9375rem; font-weight: 500; color: var(--ink); }
    .strip-item .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }

    /* Problem */
    .problem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: white; border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: var(--shadow); }
    .problem .card .q { font-family: var(--head); font-size: 1.25rem; font-weight: 600; margin-bottom: 10px; }
    .problem .card p { color: var(--muted); font-size: .9375rem; }
    .problem .card .tag { display: inline-block; font-size: .75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 16px; }

    /* Features */
    .features { background: white; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .feat { border-radius: 24px; padding: 28px; transition: transform .2s ease, box-shadow .2s ease; }
    .feat:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -18px rgba(19,78,74,.35); }
    .feat .ic { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.75); display: grid; place-items: center; margin-bottom: 18px; }
    .feat h3 { font-size: 1.25rem; margin-bottom: 8px; }
    .feat p { font-size: .9375rem; opacity: .85; }

    /* Split sections */
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
    .split h2 { font-size: clamp(2rem, 4vw, 2.625rem); margin: 14px 0 16px; }
    .split > div > p { color: var(--muted); font-size: 1.0625rem; margin-bottom: 24px; }
    .ticks { list-style: none; display: grid; gap: 14px; }
    .ticks li { display: flex; gap: 12px; align-items: flex-start; font-size: .9875rem; }
    .ticks li::before { content: '✓'; flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--mint); color: var(--mint-ink); font-weight: 800; font-size: .75rem; display: grid; place-items: center; margin-top: 1px; }

    /* Pattern card (drawn, illustrative) */
    .pattern-stack { position: relative; display: grid; gap: 16px; }
    .pat { background: white; border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: flex-start; }
    .pat .badge { flex-shrink: 0; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-family: var(--head); font-weight: 700; }
    .pat b { display: block; font-size: 1rem; }
    .pat span { font-size: .875rem; color: var(--muted); }
    .journey { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .journey i { font-style: normal; font-size: .6875rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--rose); color: var(--rose-ink); }
    .journey i.ok { background: var(--mint); color: var(--mint-ink); }
    .fine { font-size: .8125rem; color: var(--muted); margin-top: 12px; }

    /* Patient app */
    .patient { background: linear-gradient(180deg, var(--page) 0%, var(--page-2) 100%); }
    .phone-lg { width: 300px; max-width: 80%; margin: 0 auto; border-radius: 40px; background: #0b1f1d; padding: 10px; box-shadow: var(--shadow-lg); }
    .phone-lg img { border-radius: 32px; aspect-ratio: 390 / 780; object-fit: cover; object-position: top; width: 100%; }

    /* Janini */
    .janini { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; border-radius: 28px; overflow: hidden; background: white; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .janini-l { padding: 48px; }
    .janini-l h2 { font-size: clamp(1.75rem, 3.4vw, 2.375rem); margin: 14px 0 16px; }
    .janini-l > p { color: var(--muted); margin-bottom: 24px; }
    .janini-r { background: var(--mint); padding: 48px; display: grid; gap: 16px; align-content: center; }
    .doc { display: flex; gap: 16px; align-items: center; background: white; border-radius: 20px; padding: 16px; }
    .doc img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
    .doc b { display: block; font-family: var(--head); font-size: 1.0625rem; }
    .doc span { font-size: .8125rem; color: var(--muted); }
    .janini-logo { height: 36px; width: auto; margin-bottom: 4px; border-radius: 6px; }

    /* Built for India */
    .india-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .india-grid .card h3 { font-size: 1.125rem; margin: 14px 0 6px; }
    .india-grid .card p { font-size: .9rem; color: var(--muted); }
    .india-grid .emoji { font-size: 1.75rem; }

    /* CTA */
    .cta { text-align: center; }
    .cta-box { background: linear-gradient(135deg, #0f766e 0%, #0d9488 55%, #14b8a6 100%); color: white; border-radius: 32px; padding: 72px 32px; position: relative; overflow: hidden; }
    .cta-box::after { content: ''; position: absolute; width: 420px; height: 420px; right: -120px; top: -160px; border-radius: 50%; background: rgba(255,255,255,.08); }
    .cta-box h2 { font-size: clamp(2rem, 4.4vw, 3rem); margin-bottom: 14px; position: relative; }
    .cta-box p { font-size: 1.125rem; opacity: .9; margin-bottom: 32px; position: relative; }
    .cta-box .btn { position: relative; }
    .cta-box .btn-white { background: white; color: var(--ink); }
    .cta-box .btn-white:hover { transform: translateY(-1px); }
    .cta-box .btn-line { border: 1px solid rgba(255,255,255,.5); color: white; }

    footer { padding: 56px 0 40px; font-size: .9rem; color: var(--muted); }
    .foot { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; }
    .foot h4 { font-family: var(--head); color: var(--ink); font-weight: 600; margin-bottom: 12px; font-size: 1rem; }
    .foot a { display: block; margin-bottom: 8px; }
    .foot a:hover { color: var(--ink); }
    .foot-bottom { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: .8125rem; }

    .wa-fab { position: fixed; right: 20px; bottom: 20px; z-index: 60; width: 56px; height: 56px; border-radius: 50%; background: #25d366; display: grid; place-items: center; box-shadow: 0 12px 28px -10px rgba(0,0,0,.4); transition: transform .15s; }
    .wa-fab:hover { transform: scale(1.06); }

    /* Tablets */
    @media (max-width: 1000px) {
      .hero-grid, .split, .janini { grid-template-columns: 1fr; }
      .hero-grid { gap: 40px; }
      .feat-grid, .india-grid { grid-template-columns: repeat(2, 1fr); }
      .strip-grid { grid-template-columns: repeat(2, 1fr); }
      .split .visual { order: -1; }
      .nav-links { display: none; }
    }
    /* Phones */
    @media (max-width: 640px) {
      .wrap { padding: 0 16px; }
      section { padding: 64px 0; }
      .hero { padding: 32px 0 56px; }
      .hero .lede { font-size: 1.0625rem; }
      .hero-ctas .btn { flex: 1 1 100%; }
      .problem-grid, .feat-grid, .india-grid, .foot { grid-template-columns: 1fr; }
      .strip-grid { grid-template-columns: 1fr; gap: 14px; }
      .float-a { left: -6px; top: 36%; }
      .float-b { display: none; }
      .phone { right: -4px; width: 36%; border-radius: 22px; padding: 5px; }
      .phone img { border-radius: 18px; }
      .janini-l, .janini-r { padding: 28px 20px; }
      .nav-right .signin { display: none; }
      .cta-box { padding: 56px 20px; border-radius: 24px; }
      .card, .feat { padding: 24px 20px; }
    }
  </style>
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <div class="card" style="max-width:460px;width:100%;padding:36px 28px;text-align:center">
    <a href="/" class="logo" style="justify-content:center;margin-bottom:20px"><span class="logo-mark">IC</span>IVFComputer</a>
    <h1 style="font-size:1.75rem;margin-bottom:8px">Sign in to your clinic</h1>
    <p style="color:var(--muted);margin-bottom:24px">Each clinic has its own IVFComputer address. Type your clinic's name as it appears in your address.</p>
    <form id="f" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:white;overflow:hidden">
        <input id="c" required autocomplete="off" placeholder="yourclinic" style="flex:1;border:0;padding:14px 16px;font:inherit;outline:none;min-width:0">
        <span style="padding:0 14px;color:var(--muted);font-size:.9375rem">.ivfcomputer.com</span>
      </div>
      <button class="btn btn-primary" style="border:0;cursor:pointer;font:inherit;font-weight:600">Continue →</button>
    </form>
    <p style="color:var(--muted);font-size:.875rem;margin-top:20px">Not sure of your address? <a href="https://wa.me/919900638277" style="color:var(--teal);font-weight:600">Message us on WhatsApp</a></p>
  </div>
</main>
<script>
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById('c').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
    if (name) location.href = 'https://' + name + '.ivfcomputer.com';
  };
</script>
</body>
</html>
