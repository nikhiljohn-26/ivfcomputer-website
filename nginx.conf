server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Addresses the old site used, so links people saved still land somewhere.
  location = /about      { try_files /about.html =404; }
  location = /login      { try_files /login.html =404; }
  location = /sign-in    { return 301 /login; }
  location = /pricing    { return 301 /; }
  location = /case-study { return 301 /#janini; }

  location /assets/ { expires 7d; add_header Cache-Control "public"; }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
